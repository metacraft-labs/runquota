# THIS REPOSITORY'S PRE-COMMIT HOOKS, COMMITTED, AND READ BY BOTH TOOLS.
#
# metacraft-dev-guidelines/policies/repo-requirements.md §4.1 names this form
# -- a committed `.pre-commit-config.yaml` -- for every Windows developer, and
# RunQuota is built and used on Windows. It is also what makes the hook work
# in every worktree. The hooks live in the COMMON git directory, so a linked
# worktree (`git worktree add`) runs the hook its main checkout installed.
# When this file was generated by git-hooks.nix as a gitignored symlink, it
# existed only where a dev shell had been entered. A fresh linked worktree had
# none, and the hook refused every commit there ("No .pre-commit-config.yaml
# file was found"), whatever the commit contained. Committed, the rules are in
# every worktree.
#   tests/test_linked_worktree_commits_without_its_dev_shell.sh
#
# ONE FILE FOR BOTH TOOLS. pre-commit (the flake shell's) and prek (the repro
# shell's, on every platform) both read this file. Do not add a `prek.toml`.
# prek reads one before this file and ignores this one, so its rules would
# silently stop applying to prek. That was measured here: with both files, an
# added `*.ct` committed cleanly under prek.
#
# Install: automatic on dev-shell entry (`nix develop`, direnv), through
#          scripts/install-git-hooks.sh from flake.nix's shellHook; from a
#          repro shell, `repro exec -- prek install`.
# Run:     pre-commit run --all-files   (or: prek run --all-files)
#
# THE FLAKE'S `pre-commit-check` (git-hooks.nix) is not installed by the dev
# shell. It runs `just lint` under `nix flake check`, from its own generated
# config.
#
# ON NixOS, `uv` MUST BE ON PATH FOR prek. The first two hooks come from
# `language: python` hook repositories. The `uv` prek downloads for itself is
# a generic-linux dynamically linked binary, which NixOS cannot exec. The
# hooks then fail to INSTALL and refuse every commit, for a reason unrelated
# to its content (repo-requirements.md §4.x). pre-commit builds its own
# virtualenvs and is not affected.

minimum_pre_commit_version: '3.0.0'

repos:
  # --- The committed-binaries tier of §4.3. ---------------------------------
  # Both act only on files a commit ADDS (`git diff --staged
  # --diff-filter=A`), never on files already tracked, so they cannot
  # retroactively fail anything here. `--enforce-all` is deliberately not
  # passed to the first, and must not be added to "tighten" it.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # 1024 KB passed explicitly because UPSTREAM'S DEFAULT IS 500 KB;
      # dropping the argument silently halves the ceiling.
      - id: check-added-large-files
        args: ['--maxkb=1024']

  - repo: https://github.com/metacraft-labs/devops-modules
    # Pinned to a sha, never to a branch: a hook set that changes under a
    # repo without a commit in that repo is a hook set nobody can bisect.
    rev: 6ba34072850f7348e1669a6daf8a0acb79669434
    hooks:
      - id: ban-added-ct-recordings

  # --- This repository's own gate. ------------------------------------------
  # `just lint`, in the dev shell flake.nix pins. The script enters that
  # shell itself, so a commit made outside it is graded with the same tools,
  # and a worktree nobody entered can still commit. Where there is no Nix
  # (a Windows repro shell), it runs `just lint` with the shell's own tools.
  - repo: local
    hooks:
      - id: just-lint
        name: just lint
        entry: scripts/pre_commit_lint.sh
        language: script
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
