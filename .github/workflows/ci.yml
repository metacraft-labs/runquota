name: CI

# THROWAWAY PROBE: the debug suite on the runner class the release probe used.
on:
  workflow_dispatch:

jobs:
  choose-linux:
    # The shared CI_RUNNER_MODE policy selects free hosted runners for public
    # repos by default and preserves the org-controlled self-hosted fallback.
    uses: metacraft-labs/devops-modules/.github/workflows/reusable-choose-runner.yml@146ea35853f859bcf78cc5da7fa53705a825da30
    with:
      preferred: ubuntu-24.04
      fallback: '["self-hosted","linux","x64"]'

  test:
    needs: [choose-linux]
    name: Test
    strategy:
      fail-fast: false
      matrix:
        runner: [[self-hosted, linux, x64]]
    timeout-minutes: 90
    # Temporary native Linux ARM64 migration for this build/test job; owner: zah.
    # Follow-up: metacraft-specs/issues/2026-09-28-release-linux-arm64-runner-migration.md
    runs-on: ${{ fromJSON(needs.choose-linux.outputs.runs_on) }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Nix
        uses: metacraft-labs/devops-modules/.github/setup-nix@dev
        with:
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          substituters: ${{ vars.SUBSTITUTERS }}
          nix-github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run tests
        # Keep the complete environment rooted for the job. On the shared
        # macOS hosts an unrooted helper disappeared from /nix/store while
        # the suite was running. RUNNER_TEMP is removed after the job.
        run: nix develop --profile "$RUNNER_TEMP/runquota-test-shell" --command just test
      - name: Dev shell writes nothing into another repository
        # The script enters `nix develop` itself, from a scratch repository
        # and from a copy of this one; the outer shell only supplies `just`.
        # It runs even when the suite failed: the two answer different
        # questions.
        if: success() || failure()
        run: nix develop --profile "$RUNNER_TEMP/runquota-test-shell" --command just test-dev-shell
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ join(matrix.runner, '-') }}
          path: test-logs/
          retention-days: 30

