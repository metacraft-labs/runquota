name: CI

# THROWAWAY PROBE of the new jobs only; never merged.
on:
  workflow_dispatch:

jobs:
  choose-linux:
    # The shared CI_RUNNER_MODE policy selects free hosted runners for public
    # repos by default and preserves the org-controlled self-hosted fallback.
    uses: metacraft-labs/devops-modules/.github/workflows/reusable-choose-runner.yml@146ea35853f859bcf78cc5da7fa53705a825da30
    with:
      preferred: ubuntu-24.04
      fallback: '["self-hosted","linux","x64"]'

  test-release:
    needs: [choose-linux]
    name: Test (release build)
    # `just test-release`: the same suite compiled with -d:release, in
    # addition to the debug `test` job above and never instead of it. A
    # memory-ordering defect does not show at -O0, so a clause about
    # release/acquire fences that only the debug suite checks has asserted
    # nothing. Both Linux architectures: ARM64 is the weakly ordered one.
    # macOS ARM64 is weakly ordered too, but its shared host has no headroom
    # for a second suite (see the choose-macos note above); Linux ARM64 runs
    # the same code under the same memory model.
    strategy:
      fail-fast: false
      matrix:
        runner: [[self-hosted, linux, x64], [self-hosted, linux, arm64]]
    timeout-minutes: 120
    # Temporary native Linux ARM64 migration for this build/test job; owner: zah.
    # Follow-up: metacraft-specs/issues/2026-09-28-release-linux-arm64-runner-migration.md
    runs-on: ${{ contains(matrix.runner, 'x64') && fromJSON(needs.choose-linux.outputs.runs_on) || 'ubuntu-24.04-arm' }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Nix
        uses: metacraft-labs/devops-modules/.github/setup-nix@dev
        with:
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          substituters: ${{ vars.SUBSTITUTERS }}
          nix-github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run tests (release build)
        run: nix develop --profile "$RUNNER_TEMP/runquota-test-shell" --command just test-release
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-release-logs-${{ join(matrix.runner, '-') }}
          path: test-logs/
          retention-days: 30

  packages:
    needs: [choose-linux]
    name: Packages (Linux)
    # `just build-package <channel>` and `just verify-package <channel>` for
    # every channel a Linux host produces. The verifier reads the shipped
    # bytes back: the archive's member list, the .deb's control fields, the
    # .rpm's file list. `packages-windows` does the same for MSI and Scoop.
    timeout-minutes: 60
    runs-on: ${{ fromJSON(needs.choose-linux.outputs.runs_on) }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Nix
        uses: metacraft-labs/devops-modules/.github/setup-nix@dev
        with:
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          substituters: ${{ vars.SUBSTITUTERS }}
          nix-github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Provide the pinned Reprobuild CLI
        # The packaging recipe is a reprobuild project, and the Nix dev shell
        # carries no `repro`. This is the revision `pins/reprobuild.json` in
        # metacraft-github-actions names: the flake's own input, which its dev
        # shell already reads the packaging renderers from, so no second pin.
        run: |
          set -euo pipefail
          flake_ref="$(nix eval --raw --impure --expr \
            "(builtins.getFlake \"git+file://$PWD\").inputs.metacraft-github-actions.pins.reprobuild.flakeRef")"
          repro_out="$(nix build --no-link --print-out-paths "${flake_ref}#default")"
          echo "REPRO=${repro_out}/bin/repro" >> "$GITHUB_ENV"
          echo "repro from ${flake_ref}: ${repro_out}"
      - name: Build and verify every Linux package channel
        run: |
          set -euo pipefail
          in_shell=(nix develop --profile "$RUNNER_TEMP/runquota-package-shell" --command)
          "${in_shell[@]}" just build
          for channel in tarball deb rpm arch nix; do
            "${in_shell[@]}" just build-package "$channel"
            "${in_shell[@]}" just verify-package "$channel"
          done
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-logs
          path: test-logs/
          retention-days: 30

  packages-windows:
    name: Packages (Windows)
    # The Windows half of the `packages` job: `just build-package` and
    # `just verify-package` for `msi` and `scoop`, the channels only a
    # Windows host produces (WiX v3 is Windows-native). The MSI arm reads the
    # database's own tables through WindowsInstaller and launches the staged
    # tree with a scrubbed environment. The packaging recipe is a reprobuild
    # project, so the environment is setup-dev-env's reprobuild flavor, the
    # way ci-reprobuild.yml gets it, with the engine at the fleet pin.
    timeout-minutes: 90
    # Hosted, as the Windows compile gate below is, and for the same reason.
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - name: Mint installation token for cross-repo sibling clones
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Setup dev env (reprobuild flavor)
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@dev
        with:
          env-flavor: reprobuild
          gh-token: ${{ steps.ci_token.outputs.token }}
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          app-private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}

      - name: Refresh authentication before the package build
        uses: metacraft-labs/metacraft-github-actions/refresh-build-auth@dev
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID || vars.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Build and verify every Windows package channel
        shell: bash
        run: |
          set -euo pipefail
          dev-exec just build
          for channel in msi scoop; do
            dev-exec just build-package "$channel"
            dev-exec just verify-package "$channel"
          done

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-logs-windows
          path: test-logs/
          retention-days: 30

