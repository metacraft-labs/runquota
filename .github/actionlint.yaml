# actionlint configuration.
#
# actionlint validates `runs-on` against GitHub's HOSTED runner labels. Every
# label below belongs to a Metacraft self-hosted pool, so actionlint cannot
# know it and would otherwise report each one as unknown -- which in practice
# means the runner-label check gets ignored wholesale, and a typo'd pool name
# stops being an error. Declaring the pools here keeps that check ON: a label
# not on this list is still a failure.
#
# THE SINGLE-NAME `eph-*` CLASSES ARE RETIRED. 126ab5b moved every `runs-on:`
# in this repository onto the authoritative capability-label arrays
# (`[self-hosted, <os>, <arch>]`) and left this file declaring pools nothing
# selects any more. The arch labels below are what the workflows actually
# name; `self-hosted`, `linux`, `macos` and `windows` are known to actionlint
# already and are listed for the same documentary reason.
self-hosted-runner:
  labels:
    - self-hosted
    - linux
    - macos
    # The Windows pools. `[self-hosted, windows, x64]` is where ci.yml's
    # `windows-compile-gate` runs -- see the comment on that job for why
    # runquota needs a Windows leg at all; both Windows arches appear in the
    # ci-reprobuild.yml build matrix.
    - windows
    - x64
    - arm64
